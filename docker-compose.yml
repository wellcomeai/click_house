version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: clickhouse_db
      POSTGRES_USER: clickhouse_user
      POSTGRES_PASSWORD: clickhouse_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickhouse_user -d clickhouse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
