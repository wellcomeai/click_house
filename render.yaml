databases:
  - name: clickhouse-irkutsk-db
    plan: free
    databaseName: clickhouse_db
    user: clickhouse_user

services:
  - type: web
    name: clickhouse-irkutsk-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python scripts/create_admin.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clickhouse-irkutsk-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ADMIN_EMAIL
        value: well96well@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://clickhouse-irkutsk.onrender.com

  - type: web
    name: clickhouse-irkutsk-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          name: clickhouse-irkutsk-api
          type: web
          property: host
